<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>colord trongle</title>
    </head>
    <body onload="initWebGL();">
        <canvas id="gl" width="800px" height="600px">
            WebGL is not supported
        </canvas>

        <textarea id="vs" spellcheck="false">
            precision mediump float;
            attribute vec3 Pos;
            attribute vec3 Color;
            attribute vec2 UV;
            attribute vec3 Normal;
            uniform vec4 Angle;
            uniform float Scale;
            varying vec3 vertexColor;
            varying vec2 uv;
            varying vec3 normal;
            void main() {
                float coX = cos(Angle.x);
                float siX = sin(Angle.x);
                mat4 matX = mat4(
                    vec4(1.0, 0.0, 0.0, 0.0),
                    vec4(0.0, coX, siX, 0.0),
                    vec4(0.0, -siX, coX, 0.0),
                    vec4(0.0, 0.0, 0.0, 1.0));
                float coY = cos(Angle.y);
                float siY = sin(Angle.y);
                mat4 matY = mat4(
                    vec4(coY, 0.0,-siY, 0.0),
                    vec4(0.0, 1.0, 0.0, 0.0),
                    vec4(siY, 0.0, coY, 0.0),
                    vec4(0.0, 0.0, 0.0, 1.0));
                float scale = Scale;
                mat4 matS = mat4(
                    vec4(scale, 0.0, 0.0, 0.0),
                    vec4(0.0, scale, 0.0, 0.0),
                    vec4(0.0, 0.0, scale, 0.0),
                    vec4(0.0, 0.0, 0.0, 1.0));
            gl_Position = matY * matX * matS * vec4(Pos, 1.0);
            vertexColor = Color;
            uv = UV;
            normal = mat3(matY * matX) * Normal;
            }
        </textarea>

        <textarea id="fs" spellcheck="false">
            precision mediump float;
            uniform sampler2D Texture;
            uniform vec4 Display;
            varying vec3 vertexColor;
            varying vec2 uv;
            varying vec3 normal;
            void main()
            {
                vec3 lightDirection = vec3(0.0, 0.0, 1.0);
                float lambert = dot(lightDirection, normal);
                vec3 shade = Display.rgb * lambert;
                float p = abs(Display.w);
                vec3 texture = texture2D(Texture, uv).rgb;
                vec3 color = vertexColor;
                gl_FragColor = vec4(mix(color, texture, p) *shade, 1.0);
            }
        </textarea>
        <br>
        <select id="shape" onchange="initShaders();">
            <option selected>Triangle</option>
            <option>Quad</option>
            <option>Cube</option>
        </select>
        <input type="checkbox" id="t" onchange="Update();">Show Texture
        <input type="color" id="l" value="#FFFFFF" onchange="Update();">Light Color<br>
        <div id="ui">Generate UI for geometry here!</div>
        <script src="js/webgl.js" defer></script>
    </body>  
</html>
